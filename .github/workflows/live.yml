name: Suivi en séance

# Relevé toutes les ~3 minutes pendant les bourses de Paris (9h-17h30) et New York (15h30-22h).
# Chaque passage relance le suivant lui-même (les plannings GitHub très fréquents sont peu fiables).
# Le planning ci-dessous ne sert que de filet de sécurité pour (re)démarrer la chaîne.
on:
  schedule:
    - cron: "2,32 7-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test_push:
        description: "Envoyer une notification de test"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Heure de départ
        id: start
        run: echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Clé d'envoi des notifications
        uses: actions/cache@v4
        with:
          path: .vapid
          key: vapid-key-v1

      - name: Restaurer l'état des alertes déjà envoyées
        uses: actions/cache/restore@v4
        with:
          path: data/live_state.json
          key: live-state-${{ github.run_id }}
          restore-keys: live-state-

      - name: Notification de test
        if: inputs.test_push == true
        env:
          PUSH_SEED: ${{ secrets.PUSH_SEED }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: python scripts/push.py test

      - name: Cotations en séance + alertes e-mail
        id: live
        env:
          ALERT_EMAIL_USER: ${{ secrets.ALERT_EMAIL_USER }}
          ALERT_EMAIL_PASSWORD: ${{ secrets.ALERT_EMAIL_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_SMTP_HOST: ${{ secrets.ALERT_SMTP_HOST }}
          PUSH_SEED: ${{ secrets.PUSH_SEED }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: python scripts/live.py

      - name: Sauvegarder l'état des alertes
        if: always() && hashFiles('data/live_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/live_state.json
          key: live-state-${{ github.run_id }}

      - name: Préparer le site
        if: hashFiles('data/live.json') != ''
        id: site
        env:
          PUSH_SEED: ${{ secrets.PUSH_SEED }}
        run: |
          mkdir -p _site
          cp index.html .nojekyll sw.js manifest.webmanifest _site/
          cp icon-*.png _site/
          rsync -a --exclude 'prices.parquet' --exclude 'live_state.json' data/ _site/data/
          python scripts/push.py pubkey > _site/data/push_key.txt
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - if: steps.site.outputs.ok == '1'
        uses: actions/configure-pages@v5
      - if: steps.site.outputs.ok == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.site.outputs.ok == '1'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Relancer le prochain relevé dans ~3 minutes
        if: always() && hashFiles('data/live.json') != '' && inputs.test_push != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - ${{ steps.start.outputs.t }} ))
          wait=$(( 180 - elapsed )); [ $wait -gt 0 ] && sleep $wait
          gh workflow run live.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
