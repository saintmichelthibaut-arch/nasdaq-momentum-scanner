<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nasdaq Momentum Scanner</title>
<meta name="description" content="Repère les actions tech US qui commencent à accélérer, avant que le mouvement soit évident.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c1016">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Onest:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout : tableau de bord en cartes. En-tête (fraîcheur des données + style d'investissement),
   bande de 4 chiffres clés, puis sections empilées ; chaque section = une phrase d'explication
   + une grille de cartes (4 → 2 → 1 colonne). Fiche titre en panneau latéral.
   Azur = interactif et score. Vert / rouge / ambre = uniquement hausses, baisses, vigilance. */
:root {
  --bg: #0c1016;
  --surface: #131a22;
  --surface-2: #19222c;
  --surface-3: #202b37;
  --line: #232e3a;
  --fg: #e8edf3;
  --fg-2: #a9b4c1;
  --fg-3: #6f7c8b;
  --accent: #6aa9ff;
  --accent-soft: rgba(106, 169, 255, 0.14);
  --up: #38cf8f;
  --down: #ff6b6b;
  --warn: #f4b544;
  --up-soft: rgba(56, 207, 143, 0.14);
  --down-soft: rgba(255, 107, 107, 0.14);
  --warn-soft: rgba(244, 181, 68, 0.14);
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --display: "Bricolage Grotesque", "Onest", system-ui, sans-serif;
  --body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f2f5f8; --surface-3: #e8edf3; --line: #e1e7ee;
    --fg: #101720; --fg-2: #4a5666; --fg-3: #7f8a98;
    --accent: #2c6ad8; --accent-soft: rgba(44, 106, 216, 0.10);
    --up: #0f8f5a; --down: #d63a3a; --warn: #b7771a;
    --up-soft: rgba(15, 143, 90, 0.10); --down-soft: rgba(214, 58, 58, 0.10); --warn-soft: rgba(183, 119, 26, 0.12);
    --shadow: 0 18px 50px rgba(16, 23, 32, 0.16);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f6f9; --surface: #ffffff; --surface-2: #f2f5f8; --surface-3: #e8edf3; --line: #e1e7ee;
  --fg: #101720; --fg-2: #4a5666; --fg-3: #7f8a98;
  --accent: #2c6ad8; --accent-soft: rgba(44, 106, 216, 0.10);
  --up: #0f8f5a; --down: #d63a3a; --warn: #b7771a;
  --up-soft: rgba(15, 143, 90, 0.10); --down-soft: rgba(214, 58, 58, 0.10); --warn-soft: rgba(183, 119, 26, 0.12);
  --shadow: 0 18px 50px rgba(16, 23, 32, 0.16);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font-family: var(--body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); } .warn { color: var(--warn); }
.muted { color: var(--fg-2); } .faint { color: var(--fg-3); }
.na { color: var(--fg-3); border-bottom: 1px dotted var(--fg-3); cursor: help; }
.wrap { max-width: 1320px; margin: 0 auto; padding-inline: 16px; }

/* ── en-tête ─────────────────────────────────── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand b { font-family: var(--display); font-size: 18px; letter-spacing: -0.01em; }
.brand small { display: block; font-size: 12px; color: var(--fg-3); }
.fresh { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; color: var(--fg-2); }
.fresh .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 3px var(--up-soft); flex: none; }
.fresh.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.fresh.bad .dot { background: var(--down); box-shadow: 0 0 0 3px var(--down-soft); }
.spacer { flex: 1; }
.mkts { display: flex; gap: 6px; flex-wrap: wrap; }
.mkt { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; color: var(--fg-2); white-space: nowrap; }
.mkt b { color: var(--fg); font-weight: 600; }
.mkt .led { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); }
.mkt.open .led { background: var(--up); box-shadow: 0 0 0 3px var(--up-soft); }
.style-pick { display: flex; align-items: center; gap: 10px; }
.style-pick > span { font-size: 12.5px; color: var(--fg-3); }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 13px; color: var(--fg-2); font-weight: 500; white-space: nowrap; }
.seg button small { display: block; font-size: 10.5px; color: var(--fg-3); font-weight: 400; line-height: 1.1; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button[aria-pressed="true"] small { color: rgba(255, 255, 255, 0.8); }
.seg button:hover:not([aria-pressed="true"]) { color: var(--fg); }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 10px 14px 12px; font-size: 14px; font-weight: 500; color: var(--fg-3); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--fg); }
@media (max-width: 720px) { .top { position: static; } .style-pick > span { display: none; } }

main { padding-block: 22px 60px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 34px; }
.sec, .box, .sheet, .banners, .alerts, .card, .c-slot { grid-template-columns: minmax(0, 1fr); }

/* ── bandeaux ────────────────────────────────── */
.banners { display: grid; gap: 8px; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; }
.banner b { display: block; font-weight: 600; margin-bottom: 2px; }
.banner .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.banner.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: var(--warn-soft); }
.banner.warn .ic { background: var(--warn); color: #1a1204; }
.banner.bad { border-color: color-mix(in srgb, var(--down) 45%, var(--line)); background: var(--down-soft); }
.banner.bad .ic { background: var(--down); color: #fff; }

/* ── chiffres clés ───────────────────────────── */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.kpi .l { font-size: 12.5px; color: var(--fg-3); }
.kpi .v { font-family: var(--display); font-size: 28px; font-weight: 700; margin-top: 2px; letter-spacing: -0.02em; overflow-wrap: anywhere; }
.kpi .s { font-size: 12.5px; color: var(--fg-2); margin-top: 2px; }
button.kpi { text-align: left; color: inherit; }
button.kpi:hover { border-color: var(--accent); }

/* ── sections ────────────────────────────────── */
.sec { display: grid; gap: 14px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.sec-h h2 { font-size: 22px; }
.sec-h .en { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); }
.sec-h .br { flex-basis: 100%; height: 0; order: 8; }
.sec-h p { margin: 0; color: var(--fg-2); max-width: 75ch; order: 9; }
.sec-h .more { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 13px; color: var(--fg-2); }
.sec-h .more:hover { color: var(--fg); border-color: var(--accent); }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.sec.priority { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: color-mix(in srgb, var(--accent) 4%, var(--bg)); border-radius: calc(var(--r) + 6px); padding: 20px; }
@media (max-width: 600px) { .sec.priority { padding: 14px; } }
.empty { padding: 22px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--fg-2); text-align: center; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(262px, 1fr)); gap: 12px; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 14px 12px; display: grid; gap: 10px; align-content: start; cursor: pointer; min-width: 0; transition: border-color 0.15s, transform 0.15s; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); transform: translateY(-1px); }
.c-top { display: flex; align-items: flex-start; gap: 10px; }
.c-id { min-width: 0; flex: 1; }
.c-tk { font-family: var(--display); font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 6px; letter-spacing: -0.01em; }
.c-name { font-size: 12.5px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.c-price .px { font-family: var(--mono); font-size: 15px; font-weight: 500; }
.chip { display: inline-flex; align-items: center; font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--fg-2); white-space: nowrap; }
.chip.up { background: var(--up-soft); color: var(--up); }
.chip.down { background: var(--down-soft); color: var(--down); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.c-slot { font-size: 13px; color: var(--fg-2); display: grid; gap: 6px; }
.c-why { margin: 0; font-size: 12.5px; color: var(--fg-2); border-top: 1px solid var(--line); padding-top: 9px; }
.spark-wrap { display: grid; gap: 2px; }
.spark-wrap .cap { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-3); }
.spark-wrap svg { display: block; width: 100%; height: 40px; }
.subs3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.sub .k { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg-3); }
.sub .k b { font-family: var(--mono); font-weight: 500; color: var(--fg-2); }
.bar { height: 5px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 3px; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.star { border: 0; background: none; padding: 0 2px; font-size: 16px; line-height: 1; color: var(--fg-3); }
.star[aria-pressed="true"] { color: var(--warn); }
.ring { flex: none; position: relative; }
.ring svg { display: block; }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--mono); font-size: 16px; font-weight: 600; }
.ring.big b { font-family: var(--display); font-size: 34px; }
.dots { display: flex; gap: 4px; }
.dots i { width: 100%; height: 6px; border-radius: 99px; background: var(--surface-3); }
.dots i.on { background: var(--up); }
.path { font-family: var(--mono); font-size: 13px; color: var(--fg); }
.path span { color: var(--fg-3); }
.vbars { display: flex; align-items: flex-end; gap: 3px; height: 34px; position: relative; }
.vbars i { flex: 1; background: var(--surface-3); border-radius: 3px 3px 0 0; min-height: 2px; }
.vbars i.hot { background: var(--warn); }
.vbars .avg { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--fg-3); }

.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 34px 20px; }
@media (max-width: 980px) { .two { grid-template-columns: minmax(0, 1fr); } }

/* ── alertes ─────────────────────────────────── */
.alerts { display: grid; gap: 8px; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: var(--r); cursor: pointer; }
.alert:hover { border-color: var(--accent); border-left-color: var(--warn); }
.alert .tk { font-family: var(--display); font-weight: 700; font-size: 18px; grid-row: span 3; min-width: 64px; align-self: start; }
.alert .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.alert .why { font-size: 13.5px; color: var(--fg); }
.alert .raw { font-family: var(--mono); font-size: 11px; color: var(--fg-3); white-space: nowrap; overflow-x: auto; }

/* ── tableaux ────────────────────────────────── */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; overflow: hidden; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 9px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-size: 12px; font-weight: 500; color: var(--fg-3); background: var(--surface); }
td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
th.n { font-family: var(--body); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--fg); }
th[aria-sort="ascending"]::after { content: " ↑"; color: var(--accent); }
th[aria-sort="descending"]::after { content: " ↓"; color: var(--accent); }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr:last-child td { border-bottom: 0; }
td .tk { font-family: var(--display); font-weight: 700; font-size: 15px; }
td .nm { color: var(--fg-3); font-size: 12px; margin-left: 6px; }
.mini-bar { display: inline-grid; grid-template-columns: 28px 60px; align-items: center; gap: 8px; }
.mini-bar .bar { margin: 0; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 14px; border-bottom: 1px solid var(--line); }
.search { flex: 1 1 200px; max-width: 280px; display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.search input { border: 0; background: none; outline: none; width: 100%; min-width: 0; }
.pill-btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--fg-2); }
.pill-btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.pill-btn:hover { color: var(--fg); }
.filters .count { margin-left: auto; font-size: 12.5px; color: var(--fg-3); }

/* ── secteurs ────────────────────────────────── */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tile { border-radius: var(--r); padding: 14px 16px; border: 1px solid var(--line); background: var(--surface); display: grid; gap: 8px; min-width: 0; }
.tile h3 { font-size: 16px; }
.tile .big { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.tile .row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--fg-2); }
.tile .row b { font-family: var(--mono); font-weight: 500; color: var(--fg); }
.tile .tks { display: flex; flex-wrap: wrap; gap: 4px; }
.tile .tks button { border: 0; background: var(--surface-3); border-radius: 6px; padding: 2px 7px; font-family: var(--mono); font-size: 11.5px; color: var(--fg-2); }
.tile .tks button:hover { color: var(--accent); }

/* ── fiche titre ─────────────────────────────── */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: var(--bg); }
.sheet { width: 100%; height: 100%; overflow-y: auto; background: var(--bg); padding-inline: max(20px, calc((100% - 1240px) / 2)); padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 16px; align-content: start; }
@media (max-width: 600px) { .sheet { padding-inline: 16px; } }
.sh-top { position: sticky; top: calc(-16px - env(safe-area-inset-top, 0px)); z-index: 5; background: var(--bg); padding-block: 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.sh-top h1 { font-size: 30px; }
.sh-top .nm { color: var(--fg-2); font-size: 15px; }
.sh-top .close { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 16px; color: var(--fg-2); }
.sh-top .close:hover { color: var(--fg); border-color: var(--accent); }
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 22px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--r) + 4px); padding: 18px 20px; }
@media (max-width: 600px) { .verdict { grid-template-columns: minmax(0, 1fr); } }
.verdict h2 { font-size: 22px; }
.verdict .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.verdict .facts .chip { font-family: var(--body); font-size: 12.5px; padding: 4px 10px; white-space: normal; }
.verdict .line { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; color: var(--fg-2); font-size: 13.5px; align-items: center; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: grid; gap: 12px; align-content: start; }
.box h3 { font-size: 16px; }
.box .hint { font-size: 12.5px; color: var(--fg-3); margin: -8px 0 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.why-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px 40px; gap: 10px; align-items: center; font-size: 13px; }
.why-row .l small { display: block; color: var(--fg-3); font-size: 11.5px; }
.why-row .bar { height: 7px; margin: 0; }
.why-row .v { font-family: var(--mono); text-align: right; }
.chg-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding-block: 7px; border-bottom: 1px solid var(--line); font-size: 13px; }
.chg-row:last-child { border-bottom: 0; }
.chg-row .was { font-family: var(--mono); color: var(--fg-3); font-size: 12px; }
.chg-row .now { font-family: var(--mono); display: inline-flex; gap: 6px; align-items: center; }
.check { display: flex; gap: 10px; align-items: center; font-size: 13px; padding-block: 3px; }
.check i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 11px; flex: none; background: var(--surface-3); color: var(--fg-3); }
.check.ok i { background: var(--up-soft); color: var(--up); }
.check.ko { color: var(--fg-3); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .seg button { padding: 5px 12px; font-size: 12.5px; }
.chart-box svg { display: block; width: 100%; height: auto; }
.readout { font-family: var(--mono); font-size: 11.5px; color: var(--fg-3); min-height: 18px; white-space: nowrap; overflow-x: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--fg-3); }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--fg-3); vertical-align: middle; margin-right: 5px; }
details.adv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
details.adv summary { padding: 14px 16px; cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
details.adv summary::after { content: "Afficher"; font-weight: 400; color: var(--accent); font-size: 13px; }
details.adv[open] summary::after { content: "Masquer"; }
details.adv summary::-webkit-details-marker { display: none; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); border-top: 1px solid var(--line); }
.kv > div { display: flex; justify-content: space-between; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--line); font-size: 13px; min-width: 0; }
.kv > div span:first-child { color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv > div span:last-child { font-family: var(--mono); white-space: nowrap; }
svg text { font-family: var(--mono); font-size: 11.5px; fill: var(--fg-3); }
.layers { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.layers .pill-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; padding: 5px 11px; }
.layers .pill-btn i { display: inline-block; width: 16px; height: 0; }
.layers .pill-btn[aria-pressed="false"] { opacity: 0.6; }
.lvl-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.lvl-list .chip { font-size: 11.5px; }
svg .grid-l { stroke: var(--line); stroke-width: 1; }
svg .c-up { fill: var(--up); stroke: var(--up); }
svg .c-down { fill: var(--down); stroke: var(--down); }
svg .v-up { fill: var(--up); opacity: 0.35; }
svg .v-down { fill: var(--down); opacity: 0.35; }
svg .pline { stroke: var(--accent); stroke-width: 1.8; fill: none; }
svg .parea { fill: var(--accent-soft); }
svg .sma20 { stroke: var(--fg-2); stroke-width: 1.1; fill: none; opacity: 0.8; }
svg .sma50 { stroke: var(--fg-2); stroke-width: 1.2; fill: none; stroke-dasharray: 5 3; opacity: 0.8; }
svg .sma200 { stroke: var(--fg-3); stroke-width: 1.6; fill: none; stroke-dasharray: 1.5 3; }
svg .lvl-r { stroke: var(--fg-3); stroke-width: 1; stroke-dasharray: 6 4; }
svg .lvl-s { stroke: var(--fg-3); stroke-width: 1; stroke-dasharray: 2 4; }
svg .lvl-b { stroke: var(--warn); stroke-width: 1; stroke-dasharray: 3 3; }
svg .line { stroke: var(--fg-2); stroke-width: 1.3; fill: none; }
svg .line-acc { stroke: var(--accent); stroke-width: 1.4; fill: none; }
svg .line-dim { stroke: var(--fg-3); stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
svg .xh { stroke: var(--fg-3); stroke-width: 1; }
svg .band { fill: var(--surface-2); }
svg .zero { stroke: var(--line); }

/* ── backtest ────────────────────────────────── */
p.lead { font-size: 16px; margin: 0; max-width: 72ch; }
.cmp { display: grid; gap: 10px; }
.cmp-row { display: grid; grid-template-columns: 190px minmax(0, 1fr) 70px; gap: 12px; align-items: center; font-size: 13px; }
.cmp-row .bar { height: 12px; margin: 0; }
.cmp-row .bar > i.muted-bar { background: var(--fg-3); }
.cmp-row .bar > i.neg { background: var(--down); }
.cmp-row .v { font-family: var(--mono); text-align: right; }
@media (max-width: 600px) { .cmp-row { grid-template-columns: 120px minmax(0, 1fr) 62px; } }
.dist-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 40px; gap: 8px; align-items: center; font-size: 12px; font-family: var(--mono); }
.dist-row .bar { height: 10px; margin: 0; }
.dist-row .bar > i.down-bar { background: var(--down); }
.dist-row .bar > i.up-bar { background: var(--up); }

/* ── guide ───────────────────────────────────── */
.gloss { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.gloss .box p { margin: 0; color: var(--fg-2); }
.prose { max-width: 75ch; color: var(--fg-2); }
.prose p { margin: 0; }

.dlg-bg { position: fixed; inset: 0; z-index: 60; background: rgba(4, 7, 11, 0.6); display: grid; place-items: center; padding: 16px; }
.dlg { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: calc(var(--r) + 4px); padding: 20px; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); box-shadow: var(--shadow); }
.dlg h2 { font-size: 20px; }
.dlg p, .dlg ol { margin: 0; color: var(--fg-2); }
.dlg ol { padding-left: 20px; display: grid; gap: 6px; }
.dlg textarea { width: 100%; min-height: 110px; font-family: var(--mono); font-size: 11px; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; }
.btn-main { border: 0; background: var(--accent); color: #fff; border-radius: 999px; padding: 10px 18px; font-weight: 600; justify-self: start; }
.btn-main:disabled { opacity: 0.5; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="var(--accent-soft)"/><path d="M7 23 L13 18 L17 20 L27 10" fill="none" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="27" cy="10" r="2.6" fill="var(--accent)"/></svg>
        <div><b>Momentum Scanner</b><small>Actions tech US qui commencent à accélérer</small></div>
      </div>
      <div class="fresh" id="fresh"><span class="dot"></span><span>Chargement…</span></div>
      <div class="mkts" id="mkts" aria-label="Horaires des bourses (heure française)"></div>
      <div class="spacer"></div>
      <button type="button" class="pill-btn" id="bellBtn" title="Recevoir les alertes en notification">🔔 Notifications</button>
      <div class="style-pick"><span>Mon style</span><div class="seg" id="profileSeg" role="group" aria-label="Style d'investissement"></div></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="today" aria-selected="true">Aujourd'hui</button>
      <button role="tab" data-tab="all" aria-selected="false">Toutes les actions</button>
      <button role="tab" data-tab="sectors" aria-selected="false">Secteurs</button>
      <button role="tab" data-tab="backtest" aria-selected="false">Ça marche ? (backtest)</button>
      <button role="tab" data-tab="help" aria-selected="false">Comment lire la page</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"><div class="empty">Chargement des données…</div></main>
<div id="sheetRoot"></div>

<script>
"use strict";
/* Page 100 % statique : lit data/latest.json, écrit chaque soir par GitHub Actions.
   Aucun appel à une API financière, aucune donnée inventée : une valeur absente
   s'affiche N/A avec la raison donnée par la collecte. */

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("nms2." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("nms2." + k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
};
const TABS = ["today", "all", "sectors", "backtest", "help"];
const S = {
  data: null, status: null, live: null, backtest: null, backtestErr: null, series: {}, openT: null,
  profile: store.get("profile", null),
  tab: TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get("tab", "today"),
  watch: new Set(store.get("watch", [])),
  expanded: {},
  sort: store.get("sort", { key: "score", dir: -1 }),
  f: Object.assign({ q: "", min: 0, rvol2: false, brk: false, bb: false, sector: "", watch: false, group: "", chg: "" }, store.get("filters", {})),
  allCols: store.get("allCols", false),
  heat: store.get("heat", "chg_5d"),
  chartRange: store.get("chartRange", 126), chartType: store.get("chartType", "line"),
  layers: Object.assign({ sma20: false, sma50: true, sma200: false, res: true, sup: false, brk: false }, store.get("layers", {})),
  btThr: store.get("btThr", "0"), btH: store.get("btH", "20"),
};
if (!TABS.includes(S.tab)) S.tab = "today";

// ── formatage ────────────────────────────────────────────────
const isNum = (v) => typeof v === "number" && isFinite(v);
const naSpan = (why) => `<span class="na" title="${esc(why || "donnée non disponible")}">N/A</span>`;
const reasonFor = (st, path) => (st && st.na && st.na[path]) || "donnée non disponible pour ce titre";
const cls3 = (v, eps = 0.00005) => (!isNum(v) ? "" : v > eps ? "up" : v < -eps ? "down" : "");
const fr = (v, nd = 1) => (isNum(v) ? v.toFixed(nd).replace(".", ",") : "N/A");
const sgn = (v) => (v > 0 ? "+" : "");
const zero = (v, nd) => +(v * 100).toFixed(nd) === 0;
function pct(v, nd = 1, why) { if (!isNum(v)) return naSpan(why); if (zero(v, nd)) return `<span class="num">0 %</span>`; return `<span class="num ${cls3(v)}">${sgn(v)}${fr(v * 100, nd)} %</span>`; }
function pctChip(v, nd = 1, why) { if (!isNum(v)) return naSpan(why); if (zero(v, nd)) return `<span class="chip">0 %</span>`; return `<span class="chip ${cls3(v)}">${sgn(v)}${fr(v * 100, nd)} %</span>`; }
const ptsTxt = (v, nd = 1) => `${sgn(v)}${fr(v * 100, nd)} pts`;
function pts(v, nd = 1, why) { if (!isNum(v)) return naSpan(why); return `<span class="num ${cls3(v)}">${ptsTxt(v, nd)}</span>`; }
function fx(v, nd = 2, why) { return isNum(v) ? `<span class="num">${fr(v, nd)}</span>` : naSpan(why); }
function money(v, cur, why) {
  if (!isNum(v)) return naSpan(why);
  const s = v.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return cur === "EUR" ? `${s} €` : `${s} $`;
}
function vol(v) { if (!isNum(v)) return "N/A"; return v >= 1e9 ? fr(v / 1e9, 2) + " Md" : v >= 1e6 ? fr(v / 1e6, 1) + " M" : v >= 1e3 ? fr(v / 1e3, 0) + " k" : fr(v, 0); }
function deltaChip(v, suffix = " pts") { if (!isNum(v)) return `<span class="chip">·</span>`; return `<span class="chip ${v > 0.5 ? "up" : v < -0.5 ? "down" : ""}">${sgn(v)}${fr(v, 0)}${suffix}</span>`; }
function fmtDateTime(iso) { return new Date(iso).toLocaleString("fr-FR", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }); }
function fmtDay(s) { if (!s) return "N/A"; return new Date(s + "T12:00:00Z").toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }); }
function fmtDayY(s) { if (!s) return "N/A"; return new Date(s + "T12:00:00Z").toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }); }
function ago(h) { return h < 1 ? `il y a ${Math.max(1, Math.round(h * 60))} min` : h < 48 ? `il y a ${Math.round(h)} h` : `il y a ${Math.round(h / 24)} jours`; }
const P = () => S.profile || (S.data && S.data.meta.profile_default) || "swing";
const sc = (st) => st.score.profiles[P()] || { total: null, delta: {}, hist: [] };
const byT = () => { const m = {}; (S.data ? S.data.stocks : []).forEach((s) => (m[s.ticker] = s)); return m; };
const profLabel = (p) => (p === "standard" ? "Équilibré" : S.data.meta.profiles[p].label);
function level(v) { return !isNum(v) ? "non calculable" : v >= 70 ? "fort" : v >= 50 ? "moyen" : v >= 35 ? "faible" : "très faible"; }
function ringColor(v) { return !isNum(v) ? "var(--fg-3)" : v >= 70 ? "var(--up)" : v >= 50 ? "var(--accent)" : "var(--fg-3)"; }
function ring(v, size = 54, stroke = 5, big = false) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, f = isNum(v) ? Math.max(0, Math.min(100, v)) / 100 : 0;
  return `<div class="ring${big ? " big" : ""}" style="width:${size}px;height:${size}px" title="Score ${isNum(v) ? v.toFixed(0) : "N/A"}/100">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/>
    <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${ringColor(v)}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>
    <b>${isNum(v) ? v.toFixed(0) : "–"}</b></div>`;
}
function spark(vals, w = 240, h = 40, color) {
  const v = (vals || []).map((x, i) => [i, x]).filter(([, x]) => isNum(x));
  if (v.length < 2) return "";
  const xs = (vals.length - 1) || 1, lo = Math.min(...v.map((p) => p[1])), hi = Math.max(...v.map((p) => p[1])), r = hi - lo || 1;
  const pts2 = v.map(([i, y]) => [(i / xs) * (w - 4) + 2, h - 3 - ((y - lo) / r) * (h - 8)]);
  const d = pts2.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  const col = color || (v[v.length - 1][1] >= v[0][1] ? "var(--up)" : "var(--down)");
  const [lx, ly] = pts2[pts2.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true" style="display:block;width:100%;height:${h}px"><path d="${d}L${lx.toFixed(1)},${h}L${pts2[0][0].toFixed(1)},${h}Z" fill="${col}" opacity="0.10"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
function priceSpark(st) {
  const s = (st.spark || []).filter(isNum);
  if (s.length < 2) return "";
  return `<div class="spark-wrap"><div class="cap"><span>3 derniers mois</span>${pct(s[s.length - 1] / s[0] - 1, 0)}</div>${spark(st.spark)}</div>`;
}
function subBars(st) {
  const c = st.score.components;
  const one = (l, v, tip) => `<div class="sub" title="${tip}"><div class="k"><span>${l}</span><b>${isNum(v) ? v.toFixed(0) : "–"}</b></div><div class="bar"><i style="width:${isNum(v) ? v : 0}%"></i></div></div>`;
  return `<div class="subs3">${one("Prix", c.price_momentum, "Le cours monte-t-il, et de plus en plus ?")}${one("Volume", c.volume_momentum, "Les échanges augmentent-ils, surtout de façon régulière ?")}${one("Cassure", c.breakout_potential, "Proche de franchir un plafond, ou vient de le faire avec force")}</div>`;
}
function starBtn(t, big) { const on = S.watch.has(t); return `<button type="button" class="star" data-star="${esc(t)}" aria-pressed="${on}" title="${on ? "Retirer de" : "Ajouter à"} ma liste"${big ? ' style="font-size:22px"' : ""}>${on ? "★" : "☆"}</button>`; }
function card(st, slot, why) {
  const s = sc(st);
  return `<article class="card" data-t="${esc(st.ticker)}" tabindex="0" aria-label="${esc(st.ticker)}, score ${isNum(s.total) ? s.total.toFixed(0) : "N/A"}">
    <div class="c-top"><div class="c-id"><div class="c-tk">${esc(st.ticker)}${starBtn(st.ticker)}</div><div class="c-name">${esc(st.name)} · ${esc(st.sector)}</div></div>${ring(s.total)}</div>
    ${(() => { const q = quote(st); return `<div class="c-price"><span class="px">${money(q.price, st.currency)}</span>${pctChip(q.chg)}${liveChip(q)}</div>`; })()}
    ${priceSpark(st)}
    ${slot ? `<div class="c-slot">${slot}</div>` : ""}
    ${subBars(st)}
    ${why ? `<p class="c-why">${esc(why)}</p>` : ""}
  </article>`;
}
function liveOk() {
  const L = S.live, D = S.data;
  if (!L || !D || !L.stocks) return false;
  const age = (Date.now() - new Date(L.generated_at_utc).getTime()) / 3.6e6;
  return L.session_date > (D.meta.market_date.US || "") && age < 12 && Object.keys(L.stocks).length > 0;
}
const LV = (t) => (liveOk() ? S.live.stocks[t] : null);
function quote(st) {
  const l = LV(st.ticker);
  return l ? { price: l.price, chg: l.chg, live: true, time: l.time } : { price: st.price.close, chg: st.price.chg_1d, live: false };
}
const liveChip = (q) => (q.live ? `<span class="chip acc" title="Cotation en séance (peut avoir quelques minutes de retard)">● direct ${esc(q.time)}</span>` : `<span class="faint" style="font-size:12px">dernière clôture</span>`);
const firstReason = (st) => (st.score.reasons && st.score.reasons[0]) || "";

// ── fraîcheur ────────────────────────────────────────────────
function freshness() {
  const m = S.data && S.data.meta, st = S.status, el = $("#fresh"), out = [];
  if (!m) { el.className = "fresh bad"; el.innerHTML = `<span class="dot"></span><span>Aucune mise à jour réussie pour l'instant</span>`; return out; }
  const gen = new Date(m.last_success_utc), ageH = (Date.now() - gen.getTime()) / 3.6e6;
  const dow = new Date().getDay(), weekend = dow === 0 || dow === 6 || (dow === 1 && ageH < 80);
  el.className = "fresh" + (ageH > 72 ? " bad" : ageH > 24 ? " warn" : "");
  el.innerHTML = `<span class="dot"></span><span>Scores du <b>${esc(fmtDay(m.market_date.US))}</b> · mis à jour ${esc(ago(ageH))}</span>` + (liveOk() ? `<span class="chip acc">● séance en direct · ${esc(new Date(S.live.generated_at_utc).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }))}</span>` : "");
  el.title = `Dernière mise à jour réussie : ${fmtDateTime(m.last_success_utc)}`;
  if (ageH > 24 && !liveOk()) out.push({ cls: ageH > 72 ? "bad" : "warn", t: ageH > 72 ? "Données périmées" : "Données de plus de 24 h",
    d: `Dernière mise à jour réussie : ${fmtDateTime(m.last_success_utc)}. ` + (weekend && ageH <= 72 ? "C'est normal le week-end : la bourse est fermée samedi et dimanche." : "La mise à jour automatique ne tourne peut-être plus : regarde l'onglet Actions sur GitHub.") });
  if (st && st.ok === false && new Date(st.last_attempt_utc) > gen) out.push({ cls: "bad", t: "La dernière mise à jour a échoué", d: `${fmtDateTime(st.last_attempt_utc)} : ${st.message}. Les chiffres affichés sont ceux de la dernière mise à jour réussie.` });
  if (m.failures && m.failures.length) out.push({ cls: "warn", t: `${m.failures.length} action(s) non mises à jour`, d: m.failures.map((f) => `${f.ticker} : ${f.reason}`).join(" · ") });
  // séance en cours écartée des scores : normal, elle est suivie en direct (live.json)
  return out;
}

// ── horaires des bourses, en heure française ─────────────────
function tzNow(tz) {
  const p = {}; new Intl.DateTimeFormat("en-US", { timeZone: tz, hour12: false, weekday: "short", hour: "2-digit", minute: "2-digit" }).formatToParts(new Date()).forEach((x) => (p[x.type] = x.value));
  return { min: (+p.hour % 24) * 60 + +p.minute, wd: p.weekday };
}
const hm = (m) => `${Math.floor(((m % 1440) + 1440) % 1440 / 60)}h${String(((m % 60) + 60) % 60).padStart(2, "0")}`;
const dur = (m) => (m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`);
function marketClock() {
  const el = $("#mkts"); if (!el) return;
  const paris = tzNow("Europe/Paris"), ny = tzNow("America/New_York");
  const off = ((paris.min - ny.min) + 1440) % 1440; // décalage New York → Paris (en général 6 h)
  const M = [
    ["🇫🇷", "Paris", paris, 9 * 60, 17 * 60 + 30, 0],
    ["🇺🇸", "New York", ny, 9 * 60 + 30, 16 * 60, off],
  ];
  el.innerHTML = M.map(([flag, name, t, o, c, shift]) => {
    const weekday = !["Sat", "Sun"].includes(t.wd), open = weekday && t.min >= o && t.min < c;
    const txt = open ? `ouverte · ferme à ${hm(c + shift)} (dans ${dur(c - t.min)})`
      : weekday && t.min < o ? `ouvre à ${hm(o + shift)} (dans ${dur(o - t.min)})`
      : `fermée · ouvre ${t.wd === "Fri" || t.wd === "Sat" ? "lundi" : "demain"} à ${hm(o + shift)}`;
    return `<span class="mkt ${open ? "open" : ""}" title="Heure française, hors jours fériés"><span class="led"></span>${flag} <b>${name}</b> ${txt}</span>`;
  }).join("");
}
marketClock(); setInterval(marketClock, 30000);

// ── chargement ───────────────────────────────────────────────
async function getJSON(url) { const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) throw new Error(`${url} : HTTP ${r.status}`); return r.json(); }
async function load() {
  try { S.status = await getJSON("data/status.json"); } catch (e) { S.status = null; }
  try { S.data = await getJSON("data/latest.json"); } catch (e) { S.data = null; S.loadErr = e.message; }
  try { S.live = await getJSON("data/live.json"); } catch (e) { S.live = null; }
  if (S.data && !S.data.meta.profiles[P()]) S.profile = S.data.meta.profile_default;

function sectorsView() {

    if (k.startsWith("chg")) { const s = k === "chg_1d" ? 0.03 : k === "chg_5d" ? 0.08 : 0.15; a = Math.min(1, Math.abs(v) / s); pos = v >= 0; }

  return `<section class="sec">${secHead("Comment lire la page", "guide", "Les mots utilisés, en clair.")}<div class="gloss">${G.map(([t, d]) => `<div class="box"><h3>${esc(t)}</h3><p>${esc(d)}</p></div>`).join("")}</div></section>
  <section class="sec">${secHead("D'où viennent les chiffres", "données", "")}<div class="box prose">
    <p>Chaque soir de semaine vers 22h30 UTC (0h30 à Paris en été), un robot GitHub télécharge les cours de la séance sur Yahoo Finance, calcule tout et enregistre le résultat. Cette page ne fait que l'afficher : rien n'est inventé ni complété. Une valeur absente s'affiche <span class="na">N/A</span> ; passe la souris dessus pour savoir pourquoi.</p>
    <p>Dernière mise à jour : ${m.ok_count} actions sur ${m.universe_count}. Historique du score : ${m.history.files} séances.</p>
    <p><b>Limites :</b> données de fin de séance seulement, rien en direct. Le backtest est optimiste, car la liste d'actions a été choisie aujourd'hui en connaissant leur parcours. Un bon score signale une configuration intéressante, pas une hausse garantie.</p></div></section>
  <section class="sec">${secHead("Les pondérations", "weights", "Le poids de chaque critère selon le style. Modifiable dans le fichier config/weights.json du dépôt GitHub.")}<div class="panel"><div class="tbl-wrap"><table><tbody>${prof}</tbody></table></div></div></section>`;
}

// ── notifications ────────────────────────────────────────────
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
let swReg = null, pushKey = null;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").then((r) => (swReg = r)).catch(() => { /* page ouverte hors https */ });
function keyBytes(b64) { const s = atob((b64 + "=".repeat((4 - b64.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(s, (c) => c.charCodeAt(0)); }
function closeDlg() { const d = $("#dlgBg"); if (d) d.remove(); }
function dlg(html) { closeDlg(); document.body.insertAdjacentHTML("beforeend", `<div class="dlg-bg" id="dlgBg"><div class="dlg" role="dialog" aria-modal="true" aria-label="Notifications">${html}<button type="button" class="pill-btn" data-dlgclose="1" style="justify-self:start">Fermer</button></div></div>`); }
function codeBlock(sub) {
  const code = JSON.stringify(sub);
  return `<p><b>Dernière étape :</b> copie ce code et envoie-le à Claude dans votre conversation : il l'ajoute au projet pour toi. Pour ton père : il fait la même chose sur son téléphone et t'envoie son code, que tu transmets aussi.</p>
    <textarea id="subCode" readonly>${esc(code)}</textarea>
    <button type="button" class="btn-main" id="copyCode">Copier le code</button>`;
}
async function openNotif() {
  if (!pushSupported()) {
    if (isIOS && !isStandalone()) return dlg(`<h2>Recevoir les alertes sur ton iPhone</h2><p>Sur iPhone, les notifications ne marchent que depuis l'icône de l'écran d'accueil, et cette icône doit avoir été ajoutée <b>après</b> cette mise à jour.</p><ol><li>Supprime l'ancienne icône Momentum de ton écran d'accueil.</li><li>Ouvre cette page dans <b>Safari</b>, touche le bouton <b>Partager</b> (carré avec une flèche), puis <b>« Sur l'écran d'accueil »</b>.</li><li>Ouvre la page depuis la nouvelle icône, puis touche 🔔 Notifications.</li></ol><p class="faint" style="font-size:12.5px">Il faut iOS 16.4 ou plus récent.</p>`);
    return dlg(`<h2>Notifications indisponibles</h2><p>Ce navigateur ne gère pas les notifications web. Sur iPhone, utilise Safari et ajoute la page à l'écran d'accueil ; sur Android ou ordinateur, utilise Chrome, Edge ou Firefox.</p>`);
  }
  try { const r = await fetch("data/push_key.txt?t=" + Date.now(), { cache: "no-store" }); pushKey = r.ok ? (await r.text()).trim() : ""; } catch (e) { pushKey = ""; }
  if (!/^[A-Za-z0-9_-]{80,90}$/.test(pushKey)) return dlg(`<h2>Presque prêt</h2><p>La clé d'envoi sera créée à la prochaine mise à jour du robot (quelques minutes). Reviens ici un peu plus tard.</p>`);
  const reg = swReg || (await navigator.serviceWorker.ready);
  const existing = await reg.pushManager.getSubscription();
  if (existing && Notification.permission === "granted") return dlg(`<h2>Notifications activées ✓</h2><p>Cet appareil est prêt. Si tu n'as pas encore envoyé son code à Claude, fais-le maintenant.</p>${codeBlock(existing)}`);
  if (Notification.permission === "denied") return dlg(`<h2>Notifications bloquées</h2><p>Tu as refusé les notifications pour cette page. Pour les réautoriser : ${isIOS ? "Réglages → Notifications → Momentum" : "réglages du site dans ton navigateur (icône à gauche de l'adresse)"}, puis reviens ici.</p>`);
  dlg(`<h2>Recevoir les alertes en notification</h2><p>Tu seras prévenu pendant la séance (volume anormal, cassure, forte variation) et le soir après la clôture. Jamais deux fois le même signal dans la journée.</p><button type="button" class="btn-main" id="doSub">Activer sur cet appareil</button><div id="subOut"></div>`);
}
async function doSubscribe(btn) {
  btn.disabled = true;
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { $("#subOut").innerHTML = `<p>Autorisation refusée. Tu pourras réessayer plus tard.</p>`; return; }
    const reg = swReg || (await navigator.serviceWorker.ready);
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: keyBytes(pushKey) });
    $("#subOut").innerHTML = codeBlock(sub.toJSON());
    btn.remove();
  } catch (e) { $("#subOut").innerHTML = `<p>L'activation a échoué : ${esc(e.message)}</p>`; btn.disabled = false; }
}
document.addEventListener("click", (e) => {
  if (e.target.id === "bellBtn") { openNotif(); return; }
  if (e.target.id === "doSub") { doSubscribe(e.target); return; }
  if (e.target.id === "copyCode") { const t = $("#subCode"); navigator.clipboard.writeText(t.value).then(() => (e.target.textContent = "Copié ✓")).catch(() => { t.select(); e.target.textContent = "Sélectionné : fais Copier"; }); return; }
  if (e.target.dataset && e.target.dataset.dlgclose || e.target.id === "dlgBg") { closeDlg(); }
});

// ── événements ───────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const star = e.target.closest("[data-star]");
  if (star) { e.stopPropagation(); const t = star.dataset.star; S.watch.has(t) ? S.watch.delete(t) : S.watch.add(t); store.set("watch", [...S.watch]); document.querySelectorAll(`[data-star="${CSS.escape(t)}"]`).forEach((b) => { const on = S.watch.has(t); b.setAttribute("aria-pressed", String(on)); b.textContent = on ? "★" : "☆"; }); return; }
  const tab = e.target.closest("#tabs button, [data-tabgo]");
  if (tab) { S.tab = tab.dataset.tab || tab.dataset.tabgo; store.set("tab", S.tab); history.replaceState(null, "", "#" + S.tab); render(); window.scrollTo(0, 0); return; }
  const jump = e.target.closest("[data-jump]"); if (jump) { const el = document.getElementById(jump.dataset.jump); if (el) el.scrollIntoView({ block: "start" }); return; }
  const pb = e.target.closest("#profileSeg button"); if (pb) { S.profile = pb.dataset.p; store.set("profile", S.profile); render(); if (S.openT) openSheet(S.openT); return; }
  if (e.target.closest("#closeSheet") || e.target.id === "sheetBg") { closeSheet(); return; }
  const rg = e.target.closest("[data-range]"); if (rg) { S.chartRange = Number(rg.dataset.range); store.set("chartRange", S.chartRange); document.querySelectorAll("[data-range]").forEach((b) => b.setAttribute("aria-pressed", String(b === rg))); drawChart(); return; }
  const ly = e.target.closest("[data-layer]"); if (ly) { const k = ly.dataset.layer; if (k === "__none") Object.keys(S.layers).forEach((x) => (S.layers[x] = false)); else S.layers[k] = !S.layers[k]; store.set("layers", S.layers); const bar = $("#layerBar"); if (bar) bar.innerHTML = layerButtons(); drawChart(); return; }
  const ct = e.target.closest("[data-ctype]"); if (ct) { S.chartType = ct.dataset.ctype; store.set("chartType", S.chartType); document.querySelectorAll("[data-ctype]").forEach((b) => b.setAttribute("aria-pressed", String(b === ct))); drawChart(); return; }
  const more = e.target.closest("[data-more]"); if (more) { S.expanded[more.dataset.more] = !S.expanded[more.dataset.more]; render(); return; }
  const op = e.target.closest("[data-open]"); if (op) { openSheet(op.dataset.open); return; }
  const th = e.target.closest("th[data-sort]"); if (th) { const k = th.dataset.sort; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : (k === "ticker" || k === "sector" ? 1 : -1) }; store.set("sort", S.sort); render(); return; }
  const mn = e.target.closest("[data-min]"); if (mn) { S.f.min = Number(mn.dataset.min); saveF(); render(); return; }
  const tf = e.target.closest("[data-f]"); if (tf) { S.f[tf.dataset.f] = !S.f[tf.dataset.f]; saveF(); render(); return; }
  const ac = e.target.closest("[data-allcols]"); if (ac) { S.allCols = !S.allCols; store.set("allCols", S.allCols); render(); return; }
  const hm = e.target.closest("[data-heat]"); if (hm) { S.heat = hm.dataset.heat; store.set("heat", S.heat); render(); return; }
  const bh = e.target.closest("[data-bth]"); if (bh) { S.btH = bh.dataset.bth; store.set("btH", S.btH); render(); return; }
  const bt = e.target.closest("[data-btthr]"); if (bt) { S.btThr = bt.dataset.btthr; store.set("btThr", S.btThr); render(); return; }
  const row = e.target.closest("[data-t]"); if (row && !e.target.closest("#sheetRoot")) openSheet(row.dataset.t);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#sheetBg")) closeSheet();
  if (e.key === "Enter" && e.target.matches && e.target.matches(".card[data-t]")) openSheet(e.target.dataset.t);
});
let rsT; window.addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { if (S.openT) drawChart(); }, 200); });
setInterval(async () => {
  if (!S.data) return;
  let changed = false;
  try { const L = await getJSON("data/live.json"); changed = !S.live || L.generated_at_utc !== S.live.generated_at_utc; S.live = L; } catch (e) { /* pas de séance en cours */ }
  try { const D = await getJSON("data/latest.json"); if (D.meta.generated_at_utc !== S.data.meta.generated_at_utc) { S.data = D; changed = true; } } catch (e) { /* garde les données actuelles */ }
  const typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if (changed && !typing) render(); else freshness();
}, 60000);
load();
</script>
</body>
</html>
